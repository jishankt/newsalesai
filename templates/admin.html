<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Kepler Tech SalesAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d0f14;
      --surface:  #141720;
      --surface2: #1c2030;
      --border:   #252a3a;
      --accent:   #3b82f6;
      --accent2:  #6366f1;
      --green:    #10b981;
      --amber:    #f59e0b;
      --red:      #ef4444;
      --text:     #e2e8f0;
      --muted:    #64748b;
      --radius:   12px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 240px;
      min-height: 100vh;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 100;
    }
    .sidebar-brand {
      padding: 24px 20px 20px;
      border-bottom: 1px solid var(--border);
    }
    .brand-logo {
      display: flex; align-items: center; gap: 10px;
    }
    .brand-dot {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .brand-name { font-weight: 700; font-size: 15px; line-height: 1.2; }
    .brand-sub  { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .nav { padding: 16px 12px; flex: 1; }
    .nav-label { font-size: 10px; font-weight: 600; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; padding: 0 8px; margin-bottom: 6px; }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 10px; border-radius: 8px; cursor: pointer;
      font-size: 13.5px; font-weight: 500; color: var(--muted);
      transition: all .15s; margin-bottom: 2px; border: none; background: none; width: 100%; text-align: left;
    }
    .nav-item:hover { background: var(--surface2); color: var(--text); }
    .nav-item.active { background: rgba(59,130,246,.15); color: var(--accent); }
    .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }

    .sidebar-footer {
      padding: 14px 16px;
      border-top: 1px solid var(--border);
      font-size: 11px; color: var(--muted);
    }

    /* ── Main ── */
    .main {
      margin-left: 240px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .topbar {
      padding: 16px 28px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      background: var(--surface);
      position: sticky; top: 0; z-index: 50;
    }
    .topbar-title { font-size: 17px; font-weight: 700; }
    .topbar-sub   { font-size: 12px; color: var(--muted); margin-top: 1px; }
    .live-badge {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 600; color: var(--green);
      background: rgba(16,185,129,.1); border: 1px solid rgba(16,185,129,.25);
      padding: 5px 12px; border-radius: 20px;
    }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    .content { padding: 28px; flex: 1; }

    /* ── Panel Visibility ── */
    .panel { display: none; }
    .panel.active { display: block; }

    /* ── Stat Cards ── */
    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap: 16px; margin-bottom: 28px;
    }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 20px; transition: transform .15s, border-color .15s;
    }
    .stat-card:hover { transform: translateY(-2px); border-color: var(--accent); }
    .stat-icon { font-size: 22px; margin-bottom: 10px; }
    .stat-value { font-size: 28px; font-weight: 800; line-height: 1; }
    .stat-label { font-size: 12px; color: var(--muted); margin-top: 5px; }
    .stat-accent { color: var(--accent); }
    .stat-green  { color: var(--green); }
    .stat-amber  { color: var(--amber); }

    /* ── Category bars ── */
    .cat-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 28px; }
    .section-title { font-size: 14px; font-weight: 700; margin-bottom: 16px; color: var(--text); }
    .cat-row { margin-bottom: 12px; }
    .cat-row-top { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; }
    .cat-bar-bg { background: var(--surface2); border-radius: 4px; height: 8px; overflow: hidden; }
    .cat-bar-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width 0.8s ease; }

    /* ── Table ── */
    .table-wrap {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
    }
    .table-toolbar {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px 18px; border-bottom: 1px solid var(--border);
    }
    .search-box {
      display: flex; align-items: center; gap: 8px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 7px 12px; flex: 1; max-width: 320px;
    }
    .search-box input {
      background: none; border: none; outline: none; color: var(--text);
      font-size: 13px; font-family: inherit; width: 100%;
    }
    .search-box input::placeholder { color: var(--muted); }
    .btn {
      padding: 7px 14px; border-radius: 8px; border: none; cursor: pointer;
      font-size: 13px; font-weight: 600; font-family: inherit;
      transition: all .15s;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #2563eb; }
    .btn-ghost { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { color: var(--text); border-color: var(--accent); }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th {
      padding: 11px 16px; text-align: left; font-size: 11px; font-weight: 600;
      color: var(--muted); text-transform: uppercase; letter-spacing: .06em;
      border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; cursor: pointer; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface2); }
    td { padding: 12px 16px; vertical-align: middle; }

    .badge {
      display: inline-flex; align-items: center;
      padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600;
    }
    .badge-blue   { background: rgba(59,130,246,.15); color: #60a5fa; }
    .badge-green  { background: rgba(16,185,129,.15); color: #34d399; }
    .badge-amber  { background: rgba(245,158,11,.15); color: #fbbf24; }
    .badge-purple { background: rgba(99,102,241,.15); color: #a5b4fc; }
    .badge-gray   { background: rgba(100,116,139,.15); color: var(--muted); }
    .badge-pink   { background: rgba(236,72,153,.15); color: #f472b6; }

    /* ── Chat History Modal ── */
    .overlay {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,.7); backdrop-filter: blur(4px);
      align-items: center; justify-content: center;
    }
    .overlay.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; width: 700px; max-width: 95vw;
      max-height: 90vh; display: flex; flex-direction: column;
      box-shadow: 0 25px 60px rgba(0,0,0,.5);
      animation: slideUp .2s ease;
    }
    @keyframes slideUp { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }
    .modal-header {
      padding: 20px 24px; border-bottom: 1px solid var(--border);
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    }
    .modal-title { font-size: 16px; font-weight: 700; }
    .modal-meta  { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .close-btn {
      width: 32px; height: 32px; border-radius: 8px; border: none;
      background: var(--surface2); color: var(--muted); cursor: pointer;
      font-size: 18px; display: flex; align-items: center; justify-content: center;
      transition: all .15s; flex-shrink: 0;
    }
    .close-btn:hover { background: var(--border); color: var(--text); }

    .modal-tabs {
      display: flex; gap: 4px; padding: 12px 20px;
      border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      padding: 6px 14px; border-radius: 6px; border: none;
      background: none; color: var(--muted); font-size: 13px;
      font-weight: 500; cursor: pointer; font-family: inherit; transition: all .15s;
    }
    .tab-btn.active { background: rgba(59,130,246,.15); color: var(--accent); }
    .tab-btn:hover:not(.active) { background: var(--surface2); color: var(--text); }

    .modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    /* Chat bubbles */
    .chat-thread { display: flex; flex-direction: column; gap: 12px; }
    .msg-row { display: flex; gap: 10px; align-items: flex-start; }
    .msg-row.bot  { flex-direction: row; }
    .msg-row.user { flex-direction: row-reverse; }
    .msg-avatar {
      width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0;
    }
    .msg-avatar.bot-av  { background: rgba(59,130,246,.2); }
    .msg-avatar.user-av { background: rgba(99,102,241,.2); }
    .msg-bubble {
      max-width: 75%; padding: 10px 14px; border-radius: 12px;
      font-size: 13px; line-height: 1.55;
    }
    .msg-row.bot  .msg-bubble { background: var(--surface2); border-radius: 4px 12px 12px 12px; }
    .msg-row.user .msg-bubble { background: rgba(59,130,246,.18); border-radius: 12px 4px 12px 12px; }
    .msg-time { font-size: 10px; color: var(--muted); margin-top: 4px; }

    /* State pill grid */
    .state-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .state-pill {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 14px;
    }
    .state-pill-key { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
    .state-pill-val { font-size: 13px; font-weight: 600; word-break: break-all; }

    /* Loader */
    .loader { display: flex; align-items: center; justify-content: center; padding: 40px; color: var(--muted); font-size: 13px; gap: 10px; }
    .spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg)} }

    .empty { text-align: center; padding: 48px; color: var(--muted); font-size: 14px; }

    /* Refresh indicator */
    #refresh-ts { font-size: 11px; color: var(--muted); }
  </style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
  <div class="sidebar-brand">
    <div class="brand-logo">
      <div class="brand-dot">🖨</div>
      <div>
        <div class="brand-name">Kepler Tech</div>
        <div class="brand-sub">Admin Dashboard</div>
      </div>
    </div>
  </div>
  <nav class="nav">
    <div class="nav-label">Overview</div>
    <button class="nav-item active" onclick="showPanel('overview',this)" id="nav-overview">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      Overview
    </button>
    <div class="nav-label" style="margin-top:16px">Activity</div>
    <button class="nav-item" onclick="showPanel('sessions',this)" id="nav-sessions">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Chat Sessions
    </button>
    <button class="nav-item" onclick="showPanel('leads',this)" id="nav-leads">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Leads
    </button>
  </nav>
  <div class="sidebar-footer">
    SalesAI v2 · <span id="refresh-ts">—</span>
  </div>
</aside>

<!-- Main -->
<div class="main">
  <div class="topbar">
    <div>
      <div class="topbar-title" id="page-title">Overview</div>
      <div class="topbar-sub">Kepler Tech LLC — Customer Conversations</div>
    </div>
    <div style="display:flex;align-items:center;gap:12px;">
      <div class="live-badge"><div class="live-dot"></div> Live</div>
      <button class="btn btn-ghost" onclick="refreshAll()">↻ Refresh</button>
    </div>
  </div>

  <div class="content">

    <!-- ── OVERVIEW PANEL ── -->
    <div class="panel active" id="panel-overview">
      <div class="stats-grid" id="stats-grid">
        <div class="loader"><div class="spinner"></div> Loading…</div>
      </div>
      <div class="cat-section">
        <div class="section-title">Category Breakdown</div>
        <div id="cat-bars"><div class="loader"><div class="spinner"></div></div></div>
      </div>
    </div>

    <!-- ── SESSIONS PANEL ── -->
    <div class="panel" id="panel-sessions">
      <div class="table-wrap">
        <div class="table-toolbar">
          <div class="search-box">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input id="session-search" type="text" placeholder="Search session ID or name…" oninput="debounceSearch()">
          </div>
          <button class="btn btn-primary" onclick="loadSessions()">Reload</button>
        </div>
        <div id="sessions-table-wrap">
          <div class="loader"><div class="spinner"></div> Loading…</div>
        </div>
      </div>
    </div>

    <!-- ── LEADS PANEL ── -->
    <div class="panel" id="panel-leads">
      <div class="table-wrap">
        <div class="table-toolbar">
          <span style="font-size:14px;font-weight:700;">Commercial Leads</span>
          <button class="btn btn-primary" onclick="loadLeads()">Reload</button>
        </div>
        <div id="leads-table-wrap">
          <div class="loader"><div class="spinner"></div> Loading…</div>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- ── Chat History Modal ── -->
<div class="overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="modal-title">Session</div>
        <div class="modal-meta" id="modal-meta">—</div>
      </div>
      <button class="close-btn" onclick="closeModalDirect()">✕</button>
    </div>
    <div class="modal-tabs">
      <button class="tab-btn active" onclick="switchTab('chat',this)">💬 Chat</button>
      <button class="tab-btn" onclick="switchTab('state',this)">⚙️ State</button>
    </div>
    <div class="modal-body">
      <div class="tab-pane active" id="tab-chat">
        <div class="chat-thread" id="chat-thread"></div>
      </div>
      <div class="tab-pane" id="tab-state">
        <div class="state-grid" id="state-grid"></div>
      </div>
    </div>
  </div>
</div>

<script>
  const CAT_LABELS = {
    technical_large_format:   'Technical CAD',
    office_printer:           'Office & Business',
    photography_large_format: 'Photography',
    citizen_photo:            'Event Photos (Citizen)',
    dye_sublimation:          'Dye-Sublimation',
    unknown:                  'Unknown',
  };
  const CAT_COLORS = {
    technical_large_format:   '#3b82f6',
    office_printer:           '#10b981',
    photography_large_format: '#6366f1',
    citizen_photo:            '#f59e0b',
    dye_sublimation:          '#ec4899',
    unknown:                  '#64748b',
  };

  let searchTimer = null;
  let currentPanel = 'overview';

  /* ── Navigation ── */
  function showPanel(name, btn) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('panel-' + name).classList.add('active');
    btn.classList.add('active');
    currentPanel = name;
    const titles = { overview: 'Overview', sessions: 'Chat Sessions', leads: 'Leads' };
    document.getElementById('page-title').textContent = titles[name] || name;
    if (name === 'sessions' && document.getElementById('sessions-table-wrap').innerHTML.includes('Loading')) loadSessions();
    if (name === 'leads' && document.getElementById('leads-table-wrap').innerHTML.includes('Loading')) loadLeads();
  }

  /* ── Stats ── */
  async function loadStats() {
    const resp = await fetch('/api/admin/stats');
    const data = await resp.json();
    if (!data.success) return;

    document.getElementById('stats-grid').innerHTML = `
      <div class="stat-card">
        <div class="stat-icon">💬</div>
        <div class="stat-value stat-accent">${data.total_sessions.toLocaleString()}</div>
        <div class="stat-label">Total Sessions</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">📅</div>
        <div class="stat-value stat-green">${data.sessions_today}</div>
        <div class="stat-label">Sessions Today</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">⚡</div>
        <div class="stat-value stat-amber">${data.active_last_hour}</div>
        <div class="stat-label">Active (1h)</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">🎯</div>
        <div class="stat-value" style="color:#ec4899">${data.leads_total}</div>
        <div class="stat-label">Total Leads</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">🔥</div>
        <div class="stat-value stat-green">${data.leads_today}</div>
        <div class="stat-label">Leads Today</div>
      </div>
    `;

    // Category bars
    const cats = data.category_breakdown;
    const total = Object.values(cats).reduce((a,b)=>a+b, 0) || 1;
    const sorted = Object.entries(cats).sort((a,b)=>b[1]-a[1]);
    document.getElementById('cat-bars').innerHTML = sorted.map(([k,v]) => {
      const pct = ((v/total)*100).toFixed(1);
      const col = CAT_COLORS[k] || '#64748b';
      const label = CAT_LABELS[k] || k;
      return `<div class="cat-row">
        <div class="cat-row-top">
          <span style="font-size:13px;font-weight:500">${label}</span>
          <span style="color:var(--muted)">${v} <span style="color:var(--accent)">${pct}%</span></span>
        </div>
        <div class="cat-bar-bg"><div class="cat-bar-fill" style="width:${pct}%;background:${col}"></div></div>
      </div>`;
    }).join('');
  }

  /* ── Sessions ── */
  async function loadSessions() {
    const search = document.getElementById('session-search').value.trim();
    document.getElementById('sessions-table-wrap').innerHTML = '<div class="loader"><div class="spinner"></div> Loading…</div>';
    const url = `/api/admin/sessions?limit=100${search ? '&search=' + encodeURIComponent(search) : ''}`;
    const resp = await fetch(url);
    const data = await resp.json();
    if (!data.success) { document.getElementById('sessions-table-wrap').innerHTML = '<div class="empty">Error loading sessions</div>'; return; }

    if (!data.sessions.length) { document.getElementById('sessions-table-wrap').innerHTML = '<div class="empty">No sessions found</div>'; return; }

    const rows = data.sessions.map(s => {
      const cat = s.category || 'unknown';
      const catLabel = CAT_LABELS[cat] || cat;
      const catCol = CAT_COLORS[cat] || '#64748b';
      const badgeCls = { technical_large_format:'badge-blue', office_printer:'badge-green', photography_large_format:'badge-purple', citizen_photo:'badge-amber', dye_sublimation:'badge-pink', unknown:'badge-gray' }[cat] || 'badge-gray';
      const stage = s.stage || '—';
      return `<tr onclick="openSession('${s.session_id}')">
        <td style="font-family:monospace;font-size:12px;color:var(--muted)">${s.session_id.slice(0,20)}…</td>
        <td>${s.customer_name || '<span style="color:var(--muted)">Anonymous</span>'}</td>
        <td><span class="badge ${badgeCls}">${catLabel}</span></td>
        <td><span class="badge badge-gray">${stage}</span></td>
        <td style="color:var(--muted)">${s.turns || 0}</td>
        <td style="color:var(--muted);font-size:12px">${s.updated || '—'}</td>
      </tr>`;
    }).join('');

    document.getElementById('sessions-table-wrap').innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Session ID</th><th>Customer</th><th>Category</th>
            <th>Stage</th><th>Turns</th><th>Last Active</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  function debounceSearch() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(loadSessions, 400);
  }

  /* ── Leads ── */
  async function loadLeads() {
    document.getElementById('leads-table-wrap').innerHTML = '<div class="loader"><div class="spinner"></div> Loading…</div>';
    const resp = await fetch('/api/admin/leads?limit=100');
    const data = await resp.json();
    if (!data.success || !data.leads.length) {
      document.getElementById('leads-table-wrap').innerHTML = '<div class="empty">No leads captured yet</div>'; return;
    }
    const rows = data.leads.map(l => `
      <tr>
        <td>${l.lead_id}</td>
        <td>${l.customer_name || '—'}</td>
        <td>${l.company || '—'}</td>
        <td>${l.email || '—'}</td>
        <td>${l.phone || '—'}</td>
        <td>${l.product_interest || '—'}</td>
        <td style="color:var(--muted);font-size:12px">${l.created || '—'}</td>
      </tr>`).join('');
    document.getElementById('leads-table-wrap').innerHTML = `
      <table>
        <thead><tr>
          <th>#</th><th>Name</th><th>Company</th>
          <th>Email</th><th>Phone</th><th>Interest</th><th>Date</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  /* ── Session Modal ── */
  async function openSession(sessionId) {
    document.getElementById('modal-title').textContent = 'Loading…';
    document.getElementById('modal-meta').textContent = '';
    document.getElementById('chat-thread').innerHTML = '<div class="loader"><div class="spinner"></div></div>';
    document.getElementById('state-grid').innerHTML = '';
    document.getElementById('modal-overlay').classList.add('open');
    switchTab('chat', document.querySelector('.tab-btn'));

    const resp = await fetch(`/api/admin/sessions/${encodeURIComponent(sessionId)}`);
    const data = await resp.json();
    if (!data.success) { document.getElementById('chat-thread').innerHTML = '<div class="empty">Error loading session</div>'; return; }

    document.getElementById('modal-title').textContent = data.customer_name || 'Anonymous Session';
    document.getElementById('modal-meta').textContent = `${sessionId.slice(0,28)} · ${data.updated}`;

    // Chat thread
    const history = data.history || [];
    if (!history.length) {
      document.getElementById('chat-thread').innerHTML = '<div class="empty">No messages in this session</div>';
    } else {
      document.getElementById('chat-thread').innerHTML = history.map(msg => {
        const role = msg.role || (msg.sender === 'user' ? 'user' : 'assistant');
        const isUser = role === 'user';
        const text = (msg.content || msg.text || msg.message || '').replace(/</g,'&lt;');
        return `<div class="msg-row ${isUser ? 'user' : 'bot'}">
          <div class="msg-avatar ${isUser ? 'user-av' : 'bot-av'}">${isUser ? '👤' : '🤖'}</div>
          <div>
            <div class="msg-bubble">${text}</div>
            <div class="msg-time" style="text-align:${isUser?'right':'left'}">${role === 'user' ? 'Customer' : 'SalesAI'}</div>
          </div>
        </div>`;
      }).join('');
    }

    // State grid
    const s = data.state || {};
    const stateFields = [
      ['Category', s.category || '—'],
      ['Stage', s.stage || '—'],
      ['Turns', s.turns_count ?? '—'],
      ['Awaiting', s.awaiting_field || '—'],
      ['Customer', s.customer_name || '—'],
      ['Results Loaded', s.results_loaded ? 'Yes' : 'No'],
    ];
    const reqEntries = Object.entries(s.requirements || {});
    document.getElementById('state-grid').innerHTML = [
      ...stateFields.map(([k,v]) => `<div class="state-pill"><div class="state-pill-key">${k}</div><div class="state-pill-val">${v}</div></div>`),
      ...reqEntries.map(([k,v]) => `<div class="state-pill"><div class="state-pill-key">req: ${k}</div><div class="state-pill-val">${JSON.stringify(v)}</div></div>`),
    ].join('');
  }

  function closeModal(e) { if (e.target === document.getElementById('modal-overlay')) closeModalDirect(); }
  function closeModalDirect() { document.getElementById('modal-overlay').classList.remove('open'); }

  function switchTab(name, btn) {
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    btn.classList.add('active');
  }

  /* ── Refresh ── */
  function refreshAll() {
    loadStats();
    if (currentPanel === 'sessions') loadSessions();
    if (currentPanel === 'leads') loadLeads();
    document.getElementById('refresh-ts').textContent = new Date().toLocaleTimeString();
  }

  /* ── Init ── */
  loadStats();
  document.getElementById('refresh-ts').textContent = new Date().toLocaleTimeString();
  setInterval(loadStats, 60000); // auto-refresh every 60s
</script>
</body>
</html>
