# Kepler Tech Sales AI - Nginx Reverse Proxy Configuration Template

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

upstream salesai_backend {
    server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name salesai.keplertech.ae;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name salesai.keplertech.ae;

    # SSL Certificate Configuration
    ssl_certificate /etc/letsencrypt/live/salesai.keplertech.ae/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/salesai.keplertech.ae/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self';" always;

    # Client limits
    client_max_body_size 5M;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # Static Assets Caching
    location /static/ {
        alias /opt/salesai/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Chat API with dedicated rate limiting
    location /api/chat {
        limit_req zone=chat_limit burst=15 nodelay;

        proxy_pass http://salesai_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # General endpoints
    location / {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://salesai_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}
