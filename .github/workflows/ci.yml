

name: SalesAI CI

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Validate Catalogue Integrity (41 Approved Entries)
      run: |
        python -c "
        from catalog.catalogue_loader import catalogue_loader, EXPECTED_CATALOGUE_COUNT
        prods = catalogue_loader.get_all()
        assert len(prods) == EXPECTED_CATALOGUE_COUNT, f'Expected {EXPECTED_CATALOGUE_COUNT} products, got {len(prods)}'
        print(f'Successfully verified {len(prods)} approved catalogue products across 5 approved catalogues.')
        "

    - name: Run Architecture & Security Hardening Tests
      run: |
        pytest tests/test_architecture_single_orchestrator.py
        pytest tests/test_security_hardening.py
        pytest tests/test_production_hardening_pass.py
        pytest tests/test_adversarial_and_resilience.py

    - name: Run Deterministic Claim & Zero-Hallucination Validation Tests
      run: |
        pytest tests/test_claim_validator.py
        pytest tests/test_deterministic_validator.py

    - name: Run Catalogue Scope, Filters & Eligibility Tests
      run: |
        pytest tests/test_catalogue_scope_and_filters.py
        pytest tests/test_retrieval_and_eligibility.py

    - name: Run Production Readiness Suite
      run: |
        pytest tests/test_production_readiness.py

    - name: Run 20 Expected Recommendation Scenarios
      run: |
        pytest tests/test_twenty_questions_suite.py

    - name: Run Pipeline Improvements & Evaluation Suites
      run: |
        pytest tests/test_pipeline_improvements.py
        pytest tests/evaluation/test_evaluation_suite.py
        pytest tests/test_continuous_flows.py

    - name: Run Multi-Agent, RAG & Consumables Verification
      run: |
        pytest tests/test_multi_agent_system.py
        pytest test_rag.py
        pytest test_nlp.py
        pytest test_consumables.py

    - name: Run Complete Test Suite
      run: |
        pytest -q tests test_rag.py test_nlp.py test_consumables.py

